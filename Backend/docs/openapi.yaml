openapi: 3.1.0
info:
  title: RUJAK.IN.SIAK POS Backend API
  version: 1.0.0
  description: |
    REST API for the RUJAK.IN.SIAK offline-first Flutter POS and back-office.

    - All money values are integers in rupiah (IDR).
    - All business entities use a UUID global identifier; internal numeric IDs are never exposed.
    - Success responses use `{"data": ..., "meta": ...}`.
    - Errors use `{"error": {"code": "...", "message": "...", "details": {...}, "retryable": false}}`.
    - Requests are scoped by the authenticated business and, where relevant, by the
      `X-Device-Id` header and the device's outlet.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Devices
  - name: Catalog
  - name: Orders
  - name: Sales
  - name: Payments
  - name: Shifts
  - name: Sync
  - name: Reports

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with email or username
      description: Issues a Sanctum bearer token (30 days), a login session, and, when `device_uuid` is supplied, a signed offline authorization lease valid for at most 72 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, example: owner@rujakinsiak.test }
                password: { type: string, format: password }
                device_uuid: { type: string, format: uuid }
                token_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      token_type: { type: string, const: Bearer }
                      expires_at: { type: string, format: date-time }
                      session_uuid: { type: string, format: uuid }
                      user: { $ref: '#/components/schemas/User' }
                      device: { $ref: '#/components/schemas/Device' }
                      offline_lease: { $ref: '#/components/schemas/OfflineLeaseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token, session, and device leases
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the current bearer token
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      token_type: { type: string, const: Bearer }
                      expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/offline-lease:
    post:
      tags: [Auth]
      summary: Issue or renew a signed offline authorization lease
      description: Requires `X-Device-Id`. When the user has a PIN, either the PIN or password proof is required.
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hours: { type: integer, minimum: 1, maximum: 72, default: 72 }
                pin: { type: string, pattern: '^[0-9]{4,6}$' }
                password: { type: string, format: password }
      responses:
        '200':
          description: Lease issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OfflineLeaseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me:
    get:
      tags: [Auth]
      summary: Current user and device profile
      parameters:
        - $ref: '#/components/parameters/DeviceHeaderOptional'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      device: { $ref: '#/components/schemas/Device' }
                      server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/pin:
    put:
      tags: [Auth]
      summary: Set or change the cashier PIN
      description: Requires `X-Device-Id`. Changing the PIN bumps `auth_version` and revokes existing leases for the device.
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, pin, pin_confirmation]
              properties:
                current_password: { type: string, format: password }
                pin: { type: string, pattern: '^[0-9]{4,6}$' }
                pin_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /devices:
    get:
      tags: [Devices]
      summary: List devices for the current business/outlet
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/register:
    post:
      tags: [Devices]
      summary: Register or update a POS device
      description: The client-generated UUID is the device identity. A revoked device cannot be registered again. Registration returns a fresh offline lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid, name]
              properties:
                uuid: { type: string, format: uuid }
                name: { type: string, maxLength: 120 }
                terminal_code: { type: string, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$', description: 'Optional. Assigned automatically as POS1, POS2, etc. when omitted.' }
                platform: { type: string, enum: [android, ios, web] }
                app_version: { type: string, maxLength: 40 }
                device_fingerprint: { type: string, maxLength: 191 }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      device: { $ref: '#/components/schemas/Device' }
                      offline_lease: { $ref: '#/components/schemas/OfflineLeaseEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /devices/{uuid}/revoke:
    post:
      tags: [Devices]
      summary: Revoke a device, its leases, sessions, and tokens
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Revoked device
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Device' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories:
    get:
      tags: [Catalog]
      summary: List categories visible to the POS
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Categories with active/available product counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
                  meta: { $ref: '#/components/schemas/CatalogMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products:
    get:
      tags: [Catalog]
      summary: List products
      description: By default only active and available products are returned.
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - name: include_unavailable
          in: query
          schema: { type: boolean, default: false }
        - name: q
          in: query
          schema: { type: string }
        - name: category_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/CatalogMeta'
                      - type: object
                        properties:
                          pagination: { $ref: '#/components/schemas/PaginationDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      summary: Create a product and publish a `product.created` sync event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{uuid}:
    put:
      tags: [Catalog]
      summary: Update a product and publish a `product.updated` sync event
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, held, resumed, converted, cancelled] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Order page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders]
      summary: Create a draft order
      description: Pricing is computed deterministically by the server. Table conflicts are flagged unless overridden by an authorized role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                order_type: { type: string, enum: [dine_in, take_away, delivery] }
                table_number: { type: string, maxLength: 30 }
                notes: { type: string, maxLength: 1000 }
                transaction_discount: { type: integer, minimum: 0 }
                table_override: { type: boolean }
                table_override_reason: { type: string, maxLength: 500 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [product_uuid, quantity]
                    properties:
                      product_uuid: { type: string, format: uuid }
                      variant_uuid: { type: string, format: uuid }
                      addon_uuids:
                        type: array
                        items: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 100 }
                      item_discount: { type: integer, minimum: 0 }
                      notes: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{uuid}:
    get:
      tags: [Orders]
      summary: Show an order
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Orders]
      summary: Update an editable order
      description: Requires the current `base_version`. A mismatch returns `ORDER_VERSION_MISMATCH`.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version]
              properties:
                base_version: { type: integer, minimum: 1 }
                order_type: { type: string, enum: [dine_in, take_away, delivery] }
                table_number: { type: string, maxLength: 30 }
                notes: { type: string, maxLength: 1000 }
                transaction_discount: { type: integer, minimum: 0 }
                items:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{uuid}/hold:
    post:
      tags: [Orders]
      summary: Hold a draft or resumed order
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionInput' }
      responses:
        '200':
          description: Held order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{uuid}/resume:
    post:
      tags: [Orders]
      summary: Resume a held order
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionInput' }
      responses:
        '200':
          description: Resumed order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{uuid}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an editable order
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version, reason]
              properties:
                base_version: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sales:
    get:
      tags: [Sales]
      summary: List sales
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: lifecycle_status
          in: query
          schema: { type: string, enum: [finalized, voided] }
        - name: payment_status
          in: query
          schema: { type: string, enum: [unpaid, partial, paid, awaiting_verification, refunded, cancelled] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Sale page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sale' }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sales/checkout:
    post:
      tags: [Sales]
      summary: Atomically convert an order into a sale
      description: |
        Enforces optimistic concurrency, idempotency, one-sale-per-order, and receipt numbering.
        Cash payments are confirmed immediately; non-cash payments become `awaiting_verification`.
        The receipt number format is `RJS-{OUTLET}-{TERMINAL}-{SEQUENCE}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_uuid, base_version]
              properties:
                order_uuid: { type: string, format: uuid }
                base_version: { type: integer, minimum: 1 }
                notes: { type: string, maxLength: 1000 }
                client_created_at: { type: string, format: date-time }
                idempotency_key: { type: string, maxLength: 120 }
                payments:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Sale created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sales/{uuid}:
    get:
      tags: [Sales]
      summary: Show a sale with items and payments
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sales/{uuid}/payments:
    post:
      tags: [Sales]
      summary: Record an additional payment against an outstanding sale
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Sale with the new payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sales/{uuid}/void:
    post:
      tags: [Sales]
      summary: Void a finalized sale without confirmed or awaiting payments
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                idempotency_key: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Voided sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sales/{uuid}/refund:
    post:
      tags: [Sales]
      summary: Refund a sale up to its confirmed and unrefunded amount
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500 }
                method: { type: string, enum: [cash, qris, transfer, ewallet] }
                idempotency_key: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Refunded sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payments/pending-verification:
    get:
      tags: [Payments]
      summary: List non-cash payments awaiting verification for the device outlet
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Payment page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SalePayment' }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/{uuid}:
    get:
      tags: [Payments]
      summary: Show a payment and its verification log
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SalePayment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{uuid}/proof:
    post:
      tags: [Payments]
      summary: Upload an optional proof of payment
      description: Only applies to non-cash payments. Replacing a proof removes the previous file.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: string
                  format: binary
      responses:
        '201':
          description: Proof uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SalePayment' }
        '200':
          description: Identical proof already stored or proof replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SalePayment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Payments]
      summary: Download the proof of payment
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Private image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{uuid}/verify:
    post:
      tags: [Payments]
      summary: Verify a non-cash payment
      description: Must be performed online by a user other than the recorder. Amount corrections require `payments.correct_amount` and a reason.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified_amount]
              properties:
                verified_amount: { type: integer, minimum: 1 }
                provider_reference: { type: string, maxLength: 200, description: 'Optional free-text note, e.g. customer name.' }
                verification_note: { type: string, maxLength: 500 }
                correction_reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Confirmed payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SalePayment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payments/{uuid}/reject:
    post:
      tags: [Payments]
      summary: Reject a non-cash payment
      description: Must be performed online by a user other than the recorder, with a reason.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Rejected payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SalePayment' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /shifts:
    get:
      tags: [Shifts]
      summary: List outlet shifts visible from the device outlet
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closing, closed_pending_sync, closed_confirmed, closed_sync_exception] }
        - name: active_only
          in: query
          description: Include only `open` and `closing` shifts.
          schema: { type: boolean }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Shift page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Shift' }
                  meta: { $ref: '#/components/schemas/Pagination' }

  /shifts/active:
    get:
      tags: [Shifts]
      summary: Get the single active outlet shift
      description: |
        Returns the `open` or `closing` shift for the device outlet, regardless
        of which user or device opened it. Every registered device in the outlet
        receives the same shift UUID and opener metadata. Responds `200` with
        `data: null` when the outlet has no active shift. Calling this endpoint
        registers the device as a shift participant.
      responses:
        '200':
          description: Active shift or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Shift'
                    nullable: true

  /shifts/open:
    post:
      tags: [Shifts]
      summary: Open the outlet shift
      description: |
        Requires `shifts.manage`. An outlet may have at most one `open` or
        `closing` shift at a time. A second attempt is rejected with
        `SHIFT_ALREADY_OPEN` (including concurrent requests), and the conflict
        details expose the currently active shift UUID and status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opening_cash]
              properties:
                opening_cash: { type: integer, minimum: 0 }
                opening_notes: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Opened shift
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Shift' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shifts/close:
    post:
      tags: [Shifts]
      summary: Request shift close and checkpoint the closing device
      description: |
        Requires `shifts.manage`. The close is two-phase:

        1. The first call moves the shift from `open` to `closing`, increments
           `close_epoch`, records the closer user/device and actual cash, and
           registers the calling device as a participant.
        2. The shift is finalized (status `closed_confirmed` and an immutable
           closing snapshot) only once every participant device has a
           checkpoint for the current `close_epoch` and has no unresolved sync
           events. Until then the response keeps the `closing` status and
           `sync.pending_devices` lists the devices that still block closure.

        Fails with `SHIFT_HAS_HELD_ORDERS` while held orders remain. The
        `pending_sync_count` sent by the closing device only proves that
        device's outbox state; it never represents other devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_uuid, actual_cash]
              properties:
                shift_uuid: { type: string, format: uuid }
                actual_cash: { type: integer, minimum: 0 }
                closing_notes: { type: string, maxLength: 1000 }
                pending_sync_count: { type: integer, minimum: 0 }
                local_event_sequence: { type: integer, minimum: 0 }
                closed_at: { type: string, format: date-time }
      responses:
        '200':
          description: Shift in `closing` state, or finalized with a snapshot when all devices are clean
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Shift' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shifts/{uuid}/sync-checkpoint:
    post:
      tags: [Shifts]
      summary: Acknowledge device sync for the current close epoch
      description: |
        Requires `shifts.view` and a registered device in the shift outlet.
        Marks the calling device as checkpointed for the shift's current
        `close_epoch` after verifying the device has no unresolved sync events.
        When the last participant checks in, the shift is finalized with an
        immutable closing snapshot. Blocked when the device still has an
        undrained outbox (`SHIFT_DEVICE_OUTBOX_NOT_DRAINED`) or unresolved
        events (`SHIFT_DEVICE_SYNC_PENDING`). A stale `close_epoch` is rejected
        with `SHIFT_CLOSE_EPOCH_CHANGED`.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                close_epoch: { type: integer, minimum: 0 }
                pending_outbox_count: { type: integer, minimum: 0 }
                last_sequence: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Shift after checkpoint, possibly finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Shift' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shifts/{uuid}:
    get:
      tags: [Shifts]
      summary: Show a shift with server summary, sync status, snapshot, and cash movements
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Shift
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{uuid}/cash-movements:
    post:
      tags: [Shifts]
      summary: Record a cash in/out movement on an open shift
      description: |
        Requires `shifts.manage`. Rejected with `SHIFT_CLOSING` once the shift
        has entered the closing phase. The movement records the acting user as
        `created_by` and the acting device.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, reason]
              properties:
                type: { type: string, enum: [in, out] }
                amount: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Updated shift
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Shift' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shifts/{uuid}/reconcile:
    post:
      tags: [Shifts]
      summary: Reconcile a shift that is waiting for sync or in a sync exception
      description: |
        Requires `shifts.reconcile` and an existing closing snapshot. Applies to
        `closed_pending_sync` and `closed_sync_exception` only; `closed_confirmed`
        shifts are rejected. Requires a resolution note. If unresolved events
        from participant devices remain, the call is rejected unless `force` is
        set; forcing marks the shift `closed_sync_exception` rather than
        confirming a complete close. The immutable snapshot is never rewritten.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_note]
              properties:
                resolution_note: { type: string, maxLength: 1000 }
                force: { type: boolean }
      responses:
        '200':
          description: Reconciled shift
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Shift' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sync/push:
    post:
      tags: [Sync]
      summary: Push an offline event batch
      description: |
        Maximum 50 events and 1 MB per batch. Events are applied independently,
        each in its own database transaction. Event IDs are idempotency keys.
        Offline batches require a valid lease token. Per-event results are one of
        `accepted`, `duplicate`, `rejected`, `conflict`, `blocked_dependency`,
        or `upgrade_required`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SyncPushResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426':
          description: Client protocol must be upgraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Batch exceeds 1 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sync/pull:
    get:
      tags: [Sync]
      summary: Pull server changes after an opaque cursor
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      responses:
        '200':
          description: Change page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SyncPullResponse' }
        '400':
          description: Invalid cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sync/bootstrap:
    get:
      tags: [Sync]
      summary: Fetch device, business, outlet, user, catalog, and sync configuration
      responses:
        '200':
          description: Bootstrap payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SyncBootstrapResponse' }

  /sync/status:
    get:
      tags: [Sync]
      summary: Device and sync status counters
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      device:
                        type: object
                        properties:
                          uuid: { type: string, format: uuid }
                          status: { type: string }
                          last_sequence: { type: integer }
                          last_seen_at: { type: string, format: date-time, nullable: true }
                      sync:
                        type: object
                        properties:
                          protocol_version: { type: integer }
                          schema_version: { type: integer }
                          last_event_id: { type: integer }
                          last_pulled_at: { type: string, format: date-time, nullable: true }
                          last_push_at: { type: string, format: date-time, nullable: true }
                          pending: { type: integer }
                          conflicts: { type: integer }
                          rejected: { type: integer }
                          upgrade_required: { type: integer }
                      catalog_version: { type: string, format: date-time, nullable: true }
                      server_time: { type: string, format: date-time }

  /reports/sales:
    get:
      tags: [Reports]
      summary: Sales report
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/OutletUuid'
      responses:
        '200': { $ref: '#/components/responses/ReportSales' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/payments:
    get:
      tags: [Reports]
      summary: Payment report grouped by method and status
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/OutletUuid'
      responses:
        '200': { $ref: '#/components/responses/ReportGeneric' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/products:
    get:
      tags: [Reports]
      summary: Product sales report
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/OutletUuid'
      responses:
        '200': { $ref: '#/components/responses/ReportGeneric' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/shifts:
    get:
      tags: [Reports]
      summary: Shift report
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/OutletUuid'
      responses:
        '200': { $ref: '#/components/responses/ReportGeneric' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    DeviceHeader:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    DeviceHeaderOptional:
      name: X-Device-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    UuidPath:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    DateFrom:
      name: date_from
      in: query
      required: true
      schema: { type: string, format: date }
    DateTo:
      name: date_to
      in: query
      required: true
      schema: { type: string, format: date }
    OutletUuid:
      name: outlet_uuid
      in: query
      required: false
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, invalid, revoked, or expired credentials/lease
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted, wrong tenant/outlet, or revoked device
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found in the current tenant scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State, version, or uniqueness conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Message:
      description: Operation result
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
    ReportSales:
      description: Sales metrics for the requested period
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      transactions: { type: integer }
                      total: { type: integer }
                      discounts: { type: integer }
                      tax: { type: integer }
                      service_charge: { type: integer }
                      voided_transactions: { type: integer }
                      voided_total: { type: integer }
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        transactions: { type: integer }
                        total: { type: integer }
                        discounts: { type: integer }
                        tax: { type: integer }
                        service_charge: { type: integer }
                  by_cashier:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        transactions: { type: integer }
                        total: { type: integer }
                  by_order_type:
                    type: array
                    items:
                      type: object
                      properties:
                        order_type: { type: string }
                        transactions: { type: integer }
                        total: { type: integer }
              meta: { $ref: '#/components/schemas/ReportMeta' }
    ReportGeneric:
      description: Report payload
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object }
              meta: { $ref: '#/components/schemas/ReportMeta' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string, example: ORDER_VERSION_MISMATCH }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            retryable: { type: boolean }

    Pagination:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationDetails'
    PaginationDetails:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    ReportMeta:
      type: object
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timezone: { type: string, example: Asia/Jakarta }
        server_time: { type: string, format: date-time }

    CatalogMeta:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        catalog_version: { type: string, format: date-time, nullable: true }
        offline_catalog_max_age_hours: { type: integer, const: 72 }

    User:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        authentication_version: { type: integer }
        has_pin: { type: boolean }

    Device:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        terminal_code: { type: string }
        platform: { type: string }
        app_version: { type: string, nullable: true }
        status: { type: string, enum: [active, revoked] }
        last_sequence: { type: integer }
        last_seen_at: { type: string, format: date-time, nullable: true }
        activated_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        outlet:
          type: object
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
            code: { type: string }

    OfflineLeaseEnvelope:
      type: object
      properties:
        token: { type: string, description: HMAC-SHA256 signed opaque lease token }
        lease:
          type: object
          properties:
            id: { type: string, format: uuid }
            user_id: { type: string, format: uuid }
            device_id: { type: string, format: uuid }
            business_id: { type: string, format: uuid }
            outlet_id: { type: string, format: uuid }
            roles:
              type: array
              items: { type: string }
            permissions:
              type: array
              items: { type: string }
            issued_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            authentication_version: { type: integer }

    Category:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        products_count: { type: integer }
        updated_at: { type: string, format: date-time, nullable: true }

    ProductInput:
      type: object
      required: [name, sku, price]
      properties:
        name: { type: string, maxLength: 150 }
        sku: { type: string, maxLength: 60 }
        barcode: { type: string, maxLength: 80, nullable: true }
        category_id: { type: integer, nullable: true }
        description: { type: string, maxLength: 3000, nullable: true }
        unit: { type: string, maxLength: 30, nullable: true }
        price: { type: integer, minimum: 0 }
        tax_rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
        is_active: { type: boolean }
        is_available: { type: boolean }
        variants:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              sku: { type: string, nullable: true }
              price_delta: { type: integer }
              is_active: { type: boolean }
        addons:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              price: { type: integer, minimum: 0 }
              is_active: { type: boolean }

    Product:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        price: { type: integer }
        tax_rate_basis_points: { type: integer }
        is_active: { type: boolean }
        is_available: { type: boolean }
        image_url: { type: string, nullable: true }
        category:
          type: object
          nullable: true
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              uuid: { type: string, format: uuid }
              name: { type: string }
              sku: { type: string, nullable: true }
              price_delta: { type: integer }
              is_active: { type: boolean }
        addons:
          type: array
          items:
            type: object
            properties:
              uuid: { type: string, format: uuid }
              name: { type: string }
              price: { type: integer }
              is_active: { type: boolean }
        updated_at: { type: string, format: date-time, nullable: true }

    TransitionInput:
      type: object
      required: [base_version]
      properties:
        base_version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }

    OrderItem:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        product_uuid: { type: string, format: uuid, nullable: true }
        sku: { type: string, nullable: true }
        product_name: { type: string }
        variant_uuid: { type: string, format: uuid, nullable: true }
        variant_name: { type: string, nullable: true }
        addons: { type: array, items: { type: object }, nullable: true }
        unit_price: { type: integer }
        quantity: { type: integer }
        item_discount: { type: integer }
        tax_rate_basis_points: { type: integer }
        notes: { type: string, nullable: true }
        line_subtotal: { type: integer }
        line_total: { type: integer }
        snapshot: { type: object, nullable: true }
        modifiers: { type: array, items: { type: object } }

    Order:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        order_number: { type: string }
        status: { type: string, enum: [draft, held, resumed, converted, cancelled] }
        version: { type: integer }
        order_type: { type: string }
        table_number: { type: string, nullable: true }
        table_conflict: { type: boolean }
        notes: { type: string, nullable: true }
        subtotal: { type: integer }
        item_discount_total: { type: integer }
        transaction_discount_total: { type: integer }
        discount_total: { type: integer }
        service_charge: { type: integer }
        tax_total: { type: integer }
        total: { type: integer }
        pricing_snapshot: { type: object, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    PaymentInput:
      type: object
      required: [method, amount]
      properties:
        method: { type: string, enum: [cash, qris, transfer, ewallet] }
        amount: { type: integer, minimum: 1 }
        tendered_amount: { type: integer, minimum: 0, description: Required for cash to be at least `amount` }
        provider_reference: { type: string, maxLength: 200, description: 'Optional free-text note, e.g. customer name or transaction reference.' }
        idempotency_key: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }

    SalePayment:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        sale_uuid: { type: string, format: uuid }
        receipt_number: { type: string }
        method: { type: string, enum: [cash, qris, transfer, ewallet] }
        amount: { type: integer }
        tendered_amount: { type: integer, nullable: true }
        change_amount: { type: integer }
        verified_amount: { type: integer, nullable: true }
        status: { type: string, enum: [confirmed, awaiting_verification, rejected] }
        origin: { type: string, enum: [online, offline] }
        provider_reference: { type: string, nullable: true, description: 'Optional free-text note captured with the payment.' }
        notes: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
        proof_required: { type: boolean, description: 'True when the business requires proof for this non-cash payment; such a payment cannot be verified before proof is uploaded.' }
        has_proof: { type: boolean }
        proof_uploaded_at: { type: string, format: date-time, nullable: true }
        recorded_by:
          type: object
          nullable: true
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        verified_by:
          type: object
          nullable: true
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        rejected_by:
          type: object
          nullable: true
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        rejection_reason: { type: string, nullable: true }
        verification_logs:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              recorded_amount: { type: integer }
              verified_amount: { type: integer, nullable: true }
              reason: { type: string, nullable: true }
              notes: { type: string, nullable: true }
              actor:
                type: object
                nullable: true
                properties:
                  uuid: { type: string, format: uuid }
                  name: { type: string }
              created_at: { type: string, format: date-time, nullable: true }
        recorded_at: { type: string, format: date-time, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }

    Sale:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        receipt_number: { type: string, example: RJS-PUSAT-T01-000001 }
        lifecycle_status: { type: string, enum: [finalized, voided] }
        payment_status: { type: string }
        order_type: { type: string }
        table_number: { type: string, nullable: true }
        subtotal: { type: integer }
        discount_total: { type: integer }
        service_charge: { type: integer }
        tax_total: { type: integer }
        total: { type: integer }
        confirmed_amount: { type: integer }
        awaiting_verification_amount: { type: integer }
        outstanding_amount: { type: integer }
        refunded_amount: { type: integer }
        transacted_at: { type: string, format: date-time }
        items:
          type: array
          items: { type: object }
        payments:
          type: array
          items: { $ref: '#/components/schemas/SalePayment' }
        pricing_snapshot: { type: object, nullable: true }

    Shift:
      type: object
      description: |
        Outlet-scoped shift. `is_active` is true for `open` and `closing`.
        Transactions are only accepted while the status is `open`.
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [open, closing, closed_pending_sync, closed_confirmed, closed_sync_exception] }
        is_active: { type: boolean }
        is_closing: { type: boolean }
        opening_cash: { type: integer }
        cash_tendered: { type: integer }
        cash_change: { type: integer }
        cash_in: { type: integer }
        cash_out: { type: integer }
        cash_refund: { type: integer }
        expected_cash: { type: integer }
        actual_cash: { type: integer, nullable: true }
        variance: { type: integer, nullable: true }
        close_actual_cash: { type: integer, nullable: true }
        confirmed_noncash: { type: integer }
        awaiting_verification_amount: { type: integer }
        local_transaction_count: { type: integer }
        pending_sync_count: { type: integer }
        local_event_sequence: { type: integer, nullable: true }
        close_epoch: { type: integer, description: Incremented when a close is requested; checkpoints must match it. }
        opening_notes: { type: string, nullable: true }
        closing_notes: { type: string, nullable: true }
        opened_at: { type: string, format: date-time, nullable: true }
        closing_started_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        cashier: { $ref: '#/components/schemas/ShiftActor', description: User who opened the shift (legacy alias). }
        opened_by: { $ref: '#/components/schemas/ShiftActor', description: User who opened the shift. Never overwritten by the closer. }
        device: { $ref: '#/components/schemas/ShiftDeviceRef', description: Device that opened the shift (legacy alias). }
        opened_device: { $ref: '#/components/schemas/ShiftDeviceRef', description: Device that opened the shift. }
        outlet:
          type: object
          nullable: true
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
            code: { type: string, nullable: true }
        closing_requested_by: { $ref: '#/components/schemas/ShiftActor', description: User who requested the close. }
        closing_requested_device: { $ref: '#/components/schemas/ShiftDeviceRef', description: Device that requested the close. }
        closed_by: { $ref: '#/components/schemas/ShiftActor', description: User who finalized the close. }
        closed_device: { $ref: '#/components/schemas/ShiftDeviceRef', description: Device that finalized the close. }
        cash_movements:
          type: array
          items:
            type: object
            properties:
              uuid: { type: string, format: uuid }
              type: { type: string, enum: [in, out] }
              amount: { type: integer }
              reason: { type: string, nullable: true }
              created_by: { type: string, nullable: true, description: Name of the acting user. }
              device_uuid: { type: string, format: uuid, nullable: true }
              occurred_at: { type: string, format: date-time, nullable: true }
        summary:
          type: object
          nullable: true
          description: Server-authoritative totals across every device in the shift.
          properties:
            opening_cash: { type: integer }
            cash_tendered: { type: integer }
            cash_change: { type: integer }
            cash_in: { type: integer }
            cash_out: { type: integer }
            cash_refund: { type: integer }
            expected_cash: { type: integer }
            confirmed_noncash: { type: integer }
            awaiting_verification_amount: { type: integer }
            local_transaction_count: { type: integer }
            sale_total: { type: integer }
            confirmed_amount: { type: integer }
            refunded_amount: { type: integer }
        sync:
          type: object
          nullable: true
          description: Checkpoint evidence. Never derived from `last_seen_at`.
          properties:
            close_epoch: { type: integer }
            closing_started_at: { type: string, format: date-time, nullable: true }
            is_closing: { type: boolean }
            participant_count: { type: integer }
            pending_device_count: { type: integer }
            can_finalize: { type: boolean }
            participants:
              type: array
              items: { $ref: '#/components/schemas/ShiftParticipant' }
            pending_devices:
              type: array
              items: { $ref: '#/components/schemas/ShiftParticipant' }
        pending_devices:
          type: array
          description: Convenience copy of `sync.pending_devices`.
          items: { $ref: '#/components/schemas/ShiftParticipant' }
        can_finalize: { type: boolean }
        closing_snapshot:
          type: object
          nullable: true
          properties:
            uuid: { type: string, format: uuid }
            opening_cash: { type: integer }
            cash_tendered: { type: integer }
            cash_change: { type: integer }
            cash_in: { type: integer }
            cash_out: { type: integer }
            cash_refund: { type: integer }
            expected_cash: { type: integer }
            actual_cash: { type: integer }
            variance: { type: integer }
            confirmed_noncash: { type: integer }
            awaiting_verification_amount: { type: integer }
            local_transaction_count: { type: integer }
            pending_sync_count: { type: integer }
            device_count: { type: integer }
            synced_device_count: { type: integer }
            checkpoint_epoch: { type: integer }
            local_event_sequence: { type: integer, nullable: true }
            closing_notes: { type: string, nullable: true }
            closed_by: { $ref: '#/components/schemas/ShiftActor' }
            closed_device: { $ref: '#/components/schemas/ShiftDeviceRef' }
            snapshot: { type: object }
            closed_at: { type: string, format: date-time, nullable: true }
            finalized_at: { type: string, format: date-time, nullable: true }

    ShiftActor:
      type: object
      nullable: true
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    ShiftDeviceRef:
      type: object
      nullable: true
      properties:
        uuid: { type: string, format: uuid }
        terminal_code: { type: string, nullable: true }
        name: { type: string, nullable: true }

    ShiftParticipant:
      type: object
      properties:
        device_uuid: { type: string, format: uuid, nullable: true }
        device_name: { type: string, nullable: true }
        terminal_code: { type: string, nullable: true }
        user_name: { type: string, nullable: true }
        requires_checkpoint: { type: boolean }
        acked: { type: boolean }
        last_ack_epoch: { type: integer }
        last_sequence: { type: integer, nullable: true }
        unresolved_events: { type: integer }
        unresolved_event_samples:
          type: array
          items: { type: object }
        last_seen_at: { type: string, format: date-time, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }

    SyncPushRequest:
      type: object
      required: [protocol_version, batch_id, device_id, outlet_id, events]
      properties:
        protocol_version: { type: integer, const: 1 }
        batch_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        origin: { type: string, enum: [online, offline] }
        lease_token: { type: string, maxLength: 16384 }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [event_id, event_type, aggregate_type, aggregate_id, sequence, payload]
            properties:
              event_id: { type: string, format: uuid }
              event_type:
                type: string
                enum:
                  - order.created
                  - order.updated
                  - order.held
                  - order.resumed
                  - order.cancelled
                  - order.converted
                  - sale.finalized
                  - sale.voided
                  - payment.recorded
                  - payment.verification_requested
                  - shift.opened
                  - shift.cash_movement
                  - shift.closed
              aggregate_type: { type: string, maxLength: 40 }
              aggregate_id: { type: string, maxLength: 64 }
              sequence: { type: integer, minimum: 1 }
              schema_version: { type: integer, minimum: 1, default: 1 }
              occurred_at: { type: string, format: date-time }
              payload: { type: object }

    SyncPushResponse:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        results:
          type: array
          items:
            type: object
            properties:
              event_id: { type: string, nullable: true }
              status:
                type: string
                enum: [accepted, duplicate, rejected, conflict, blocked_dependency, upgrade_required]
              server_record_id: { type: string, nullable: true }
              error_code: { type: string, nullable: true }
              retryable: { type: boolean }
        server_time: { type: string, format: date-time }

    SyncPullResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              event_id: { type: string, format: uuid }
              event_type: { type: string }
              aggregate_type: { type: string }
              aggregate_id: { type: string }
              aggregate_version: { type: integer, nullable: true }
              base_version: { type: integer, nullable: true }
              schema_version: { type: integer }
              source: { type: string, enum: [server, device] }
              occurred_at: { type: string, format: date-time, nullable: true }
              payload: { type: object }
        next_cursor: { type: string }
        has_more: { type: boolean }
        limit: { type: integer }
        server_time: { type: string, format: date-time }

    SyncBootstrapResponse:
      type: object
      properties:
        device: { $ref: '#/components/schemas/Device' }
        business:
          type: object
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
            address: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
            currency: { type: string, example: IDR }
            timezone: { type: string, example: Asia/Jakarta }
        outlet:
          type: object
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
            code: { type: string }
            address: { type: string, nullable: true }
            phone: { type: string, nullable: true }
        user: { $ref: '#/components/schemas/User' }
        catalog:
          type: object
          properties:
            categories:
              type: array
              items: { $ref: '#/components/schemas/Category' }
            products:
              type: array
              items: { $ref: '#/components/schemas/Product' }
            catalog_version: { type: string, format: date-time, nullable: true }
            offline_catalog_max_age_hours: { type: integer, const: 72 }
        config:
          type: object
          properties:
            currency: { type: string }
            timezone: { type: string }
            tax:
              type: object
              properties:
                enabled: { type: boolean }
                rate_basis_points: { type: integer }
                includes_service_charge: { type: boolean }
            service_charge:
              type: object
              properties:
                enabled: { type: boolean }
                rate_basis_points: { type: integer }
            receipt_number_format: { type: string, const: 'RJS-{OUTLET}-{TERMINAL}-{SEQUENCE}' }
            payment_methods:
              type: array
              items: { type: string, enum: [cash, qris, transfer, ewallet] }
            order_types:
              type: array
              items: { type: string, enum: [dine_in, take_away, delivery] }
            offline_lease_max_hours: { type: integer, const: 72 }
            sync:
              type: object
              properties:
                protocol_version: { type: integer }
                schema_version: { type: integer }
                max_batch_events: { type: integer, const: 50 }
                max_batch_bytes: { type: integer, const: 1048576 }
                pull_limit: { type: integer, const: 500 }
        open_shift: { $ref: '#/components/schemas/Shift' }
        sync:
          type: object
          properties:
            cursor: { type: string }
            server_time: { type: string, format: date-time }
